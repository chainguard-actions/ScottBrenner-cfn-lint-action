name: Test python input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Python
        run: |
          which python3
          python3 --version
      - id: action
        uses: .
        with:
          python: python3
      - name: Assert cfn-lint is available
        run: |
          echo "Checking cfn-lint is installed and accessible..."
          if ! cfn-lint --version 2>/dev/null && ! python3 -m cfn_lint --version 2>/dev/null; then
            echo "FAIL: cfn-lint does not appear to be installed"
            exit 1
          fi
          echo "PASS: cfn-lint is available"
