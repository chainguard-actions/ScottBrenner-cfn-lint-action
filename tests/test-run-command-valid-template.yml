name: Test cfn-lint run command on valid template
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install cfn-lint and run against valid template
        id: action
        uses: .
        with:
          command: "cfn-lint tests/fixtures/cfn/valid-template.yml"

      - name: Assert cfn-lint ran successfully
        run: |
          echo "Checking cfn-lint is available..."
          if ! command -v cfn-lint >/dev/null 2>&1; then
            echo "FAIL: cfn-lint not found on PATH"
            exit 1
          fi
          echo "PASS: cfn-lint ran successfully on valid template"
