name: Test lint command on invalid template
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          command: "cfn-lint tests/fixtures/invalid-template.yaml"
        continue-on-error: true
      - name: Assert cfn-lint detected errors in invalid template
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: cfn-lint correctly detected errors in invalid template"
          else
            echo "FAIL: expected cfn-lint to fail on invalid template but outcome was: $OUTCOME"
            exit 1
          fi
