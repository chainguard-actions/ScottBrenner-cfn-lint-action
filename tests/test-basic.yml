name: Test basic usage - default cfn-lint install
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
      - name: Assert cfn_lint_venv output is set
        env:
          VENV: ${{ steps.action.outputs.cfn_lint_venv }}
        run: |
          echo "cfn_lint_venv: $VENV"
          if [ -z "$VENV" ]; then
            echo "FAIL: cfn_lint_venv output is empty"
            exit 1
          fi
          echo "PASS: cfn_lint_venv is set to '$VENV'"
      - name: Assert venv directory exists
        env:
          VENV: ${{ steps.action.outputs.cfn_lint_venv }}
        run: |
          echo "Checking venv directory: $VENV"
          if [ ! -d "$VENV" ]; then
            echo "FAIL: venv directory does not exist at '$VENV'"
            exit 1
          fi
          echo "PASS: venv directory exists"
      - name: Assert cfn-lint is executable
        env:
          VENV: ${{ steps.action.outputs.cfn_lint_venv }}
        run: |
          CFN_LINT="$VENV/bin/cfn-lint"
          echo "Checking cfn-lint binary: $CFN_LINT"
          if [ ! -f "$CFN_LINT" ]; then
            echo "FAIL: cfn-lint binary not found at '$CFN_LINT'"
            exit 1
          fi
          echo "PASS: cfn-lint binary found"
          "$CFN_LINT" --version
