name: Test version input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: "==0.87.0"
      - name: Assert cfn-lint is installed with specified version
        run: |
          echo "Checking cfn-lint version..."
          CFN_LINT_VERSION=$(cfn-lint --version 2>&1 || true)
          echo "cfn-lint version output: $CFN_LINT_VERSION"
          if ! echo "$CFN_LINT_VERSION" | grep -q "0.87.0"; then
            echo "FAIL: expected cfn-lint version 0.87.0 to be installed"
            exit 1
          fi
          echo "PASS"
