name: Test specific version install
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: "==1.22.0"
      - name: Assert cfn-lint specific version is installed
        run: |
          echo "Checking cfn-lint version..."
          if ! command -v cfn-lint &>/dev/null; then
            echo "FAIL: cfn-lint not found in PATH"
            exit 1
          fi
          VERSION_OUTPUT=$(cfn-lint --version 2>&1)
          echo "cfn-lint version output: $VERSION_OUTPUT"
          if echo "$VERSION_OUTPUT" | grep -q "1.22.0"; then
            echo "PASS: cfn-lint 1.22.0 is installed"
          else
            echo "FAIL: expected version 1.22.0 but got: $VERSION_OUTPUT"
            exit 1
          fi
