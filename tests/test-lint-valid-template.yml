name: Test lint command on valid template
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          command: "cfn-lint tests/fixtures/valid-template.yaml"
      - name: Assert cfn-lint ran successfully
        run: |
          echo "cfn-lint command completed successfully on valid template"
          echo "PASS: no lint errors on valid CloudFormation template"
