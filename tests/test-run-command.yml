name: Test cfn-lint run command on valid template
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a valid CloudFormation template
        run: |
          mkdir -p /tmp/cfn-templates
          cat > /tmp/cfn-templates/valid.yaml << 'EOF'
          AWSTemplateFormatVersion: '2010-09-09'
          Description: A simple valid CloudFormation template
          Resources:
            MyBucket:
              Type: AWS::S3::Bucket
              Properties:
                BucketName: my-test-bucket
          EOF
      - id: action
        uses: .
        with:
          command: cfn-lint /tmp/cfn-templates/valid.yaml
      - name: Assert cfn-lint ran successfully
        run: |
          echo "cfn-lint command completed successfully"
          echo "PASS"
